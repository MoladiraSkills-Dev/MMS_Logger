<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MolāDira Skills (MMS) Corporate Attendance, Leave Management, and Device Checkout Portal. Secure Geolocation Logging System.">
  <meta name="author" content="MolāDira Skills (Pty) Ltd">
  <title>MolāDira Skills - MMS Attendance & Resource Access Portal</title>
  <link rel="stylesheet" href="shared/css/base.css">
  <style>
    /* Specific Landing Page Styling */
    .brand-logo-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 1.35rem;
      border-radius: var(--radius-xl);
      background: var(--grad-mms);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 35px rgba(217, 70, 239, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.25);
      position: relative;
    }

    .brand-logo-badge::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: calc(var(--radius-xl) + 4px);
      background: var(--grad-mms);
      opacity: 0.35;
      filter: blur(8px);
      z-index: -1;
    }

    .brand-logo-text {
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 1.95rem;
      color: #ffffff;
      letter-spacing: -0.04em;
    }

    .auth-card {
      border: 1px solid var(--border-muted);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: var(--shadow-xl), 0 0 45px rgba(217, 70, 239, 0.15);
      border-radius: var(--radius-xl);
      padding: 2.35rem 2.15rem;
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 3px;
      background: var(--grad-mms);
      border-radius: var(--radius-pill);
    }

    .tab-toggle-container {
      background-color: #080d1a;
      border: 1px solid var(--border-subtle);
      padding: 0.35rem;
      border-radius: var(--radius-md);
      display: flex;
      margin-bottom: 1.75rem;
      position: relative;
    }

    .tab-toggle-btn {
      flex: 1;
      padding: 0.68rem 0.6rem;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
      position: relative;
      z-index: 1;
      user-select: none;
    }

    .tab-toggle-btn:hover {
      color: var(--text-main);
    }

    .tab-toggle-btn.active {
      background: var(--grad-mms);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(217, 70, 239, 0.4);
    }

    .corporate-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <main class="auth-container">
    <div class="auth-card" id="authCard">
      
      <!-- Brand Logo & Header -->
      <header class="text-center mb-6">
        <div class="brand-logo-badge pulse-glow">
          <span class="brand-logo-text">MMS</span>
        </div>
        <h1 class="text-2xl font-bold">MolāDira <span class="text-gradient">Skills</span></h1>
        <p class="text-sm mt-1" id="authSubtitle">Attendance, Leave & Device Resource Portal</p>
        <div>
          <span class="corporate-pill">
            <span class="status-dot status-dot-success"></span> Secure Geolocation Enterprise System
          </span>
        </div>
      </header>

      <!-- Auth Mode Switcher (Login / Register) -->
      <nav class="tab-toggle-container" aria-label="Authentication Selector">
        <button type="button" id="tabLogin" class="tab-toggle-btn active" onclick="switchAuthTab('login')">
          Sign In
        </button>
        <button type="button" id="tabRegister" class="tab-toggle-btn" onclick="switchAuthTab('register')">
          Create Account
        </button>
      </nav>

      <!-- Feedback Alert Container -->
      <div id="authAlert" class="alert hidden" role="alert"></div>

      <!-- Sign In Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">
            <span>Corporate Email</span>
            <span class="text-xs text-dim">@moladiraskills.co.za</span>
          </label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@moladiraskills.co.za" required autocomplete="email" autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">
            <span>Password</span>
            <a href="#" class="text-xs" onclick="showForgotPasswordHelp(event)">Forgot?</a>
          </label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Show/Hide password" aria-label="Toggle password visibility">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-block btn-lg mt-4">
          <span>Authenticate & Access</span>
          <span>&rarr;</span>
        </button>
      </form>

      <!-- Registration Form -->
      <form id="registerForm" class="hidden" onsubmit="handleRegisterSubmit(event)" novalidate>
        <div class="grid grid-cols-2 gap-3 mb-2">
          <div class="form-group mb-2">
            <label class="form-label" for="regFirstName">First Name</label>
            <input type="text" id="regFirstName" class="form-control" placeholder="Thapelo" required autocomplete="given-name">
          </div>
          <div class="form-group mb-2">
            <label class="form-label" for="regLastName">Last Name</label>
            <input type="text" id="regLastName" class="form-control" placeholder="Mohale" required autocomplete="family-name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Corporate Email</label>
          <input type="email" id="regEmail" class="form-control" placeholder="name@moladiraskills.co.za" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Account Password</label>
          <div class="password-wrapper">
            <input type="password" id="regPassword" class="form-control" placeholder="Min 6 characters" required autocomplete="new-password" oninput="checkPasswordStrength(this.value)">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regPassword', this)" title="Show/Hide password" aria-label="Toggle password visibility">
              👁️
            </button>
          </div>
          
          <!-- Live Password Strength Meter -->
          <div class="password-strength-container" id="passwordStrengthBox">
            <div class="password-strength-track">
              <div class="password-strength-fill" id="pwdStrengthFill"></div>
            </div>
            <div class="password-strength-label">
              <span id="pwdStrengthText">Security strength</span>
              <span id="pwdLengthText">0 chars</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" required autocomplete="new-password" oninput="checkPasswordMatch()">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regConfirmPassword', this)" title="Show/Hide password" aria-label="Toggle password visibility">
              👁️
            </button>
          </div>
          <div id="pwdMatchStatus" class="text-xs mt-1 text-dim"></div>
        </div>

        <button type="submit" id="btnRegisterSubmit" class="btn btn-primary btn-block btn-lg mt-4">
          <span>Create Employee Profile</span>
          <span>&rarr;</span>
        </button>
      </form>

      <!-- Footer Info -->
      <footer class="text-center mt-6 pt-4" style="border-top: 1px solid var(--border-subtle);">
        <p class="text-xs text-dim">
          MolāDira Skills (Pty) Ltd &bull; BBBEE Level 1 Certified<br>
          White Thorn Office Park, Allen's Nek, Roodepoort
        </p>
      </footer>

    </div>
  </main>

  <script src="shared/js/api.js"></script>
  <script src="auth/auth.js"></script>
</body>
</html>
